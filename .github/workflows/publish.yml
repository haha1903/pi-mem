name: Publish to npm

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "logo*.png"
      - "tests/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Auto-bump the patch component so every push to main releases a new
      # version. We don't commit the bump back; the version is computed from
      # commit count so it's monotonic and predictable.
      - name: Compute version
        id: ver
        run: |
          base=$(node -p "require('./package.json').version" | sed 's/-.*//')
          major=$(echo $base | cut -d. -f1)
          minor=$(echo $base | cut -d. -f2)
          patch=$(git rev-list --count HEAD)
          v="${major}.${minor}.${patch}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          node -e "
            const fs=require('fs'), p=require('./package.json');
            p.version='$v';
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2)+'\n');
          "
          echo "Bumped to $v"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
